# 前端站点配置（#83）：静态资源 + /api 反代 backend 容器（SSE 不缓冲）。
# 覆盖官方镜像 conf.d/default.conf，随 frontend 服务一并打进镜像。
server {
    listen 80;
    server_name _;

    # 文档上传上限 10MB（后端同限），放宽至 20m 留余量，避免 413。
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源压缩（JS/CSS bundle 均为文本类）。
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # SPA 路由（BrowserRouter）：未知路径回退 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 反代 backend 容器（compose 网络内服务名）。
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        # SSE 流式问答：关闭缓冲与缓存，并拉长读超时，回答逐字呈现。
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
