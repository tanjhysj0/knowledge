# #71：dense 向量存储迁至 PostgreSQL/pgvector，仅保留 postgres 服务。
services:
  postgres:
    container_name: docqa-postgres
    # pgvector 官方镜像：内置 vector 扩展，支持 HNSW/COSINE 检索。
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docqa
      POSTGRES_PASSWORD: docqa
      POSTGRES_DB: docqa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docqa -d docqa"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
