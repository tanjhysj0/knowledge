# #71：dense 向量存储迁至 PostgreSQL/pgvector，仅保留 postgres 服务。
# embedding：Infinity 独立 embedding 服务（BAAI/bge-m3 常驻，后端不再进程内加载模型）。
# #82：新增 backend 服务，前端/后端纯容器部署（前端见 #83）。
# #83：新增 frontend 服务，nginx 静态服务 + /api 反代 backend（SSE 不缓冲）。
# #84：编排收尾——四服务全量健康检查，depends_on 全部升级为
# condition: service_healthy 依赖链（postgres → embedding → backend → frontend），
# 一键启动见根 README「容器部署」与 make docker-up。
services:
  postgres:
    container_name: docqa-postgres
    # pgvector 官方镜像：内置 vector 扩展，支持 HNSW/COSINE 检索。
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docqa
      POSTGRES_PASSWORD: docqa
      POSTGRES_DB: docqa
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docqa -d docqa"]
      interval: 10s
      timeout: 5s
      retries: 5

  embedding:
    container_name: docqa-embedding
    # 0.0.75 是支持 linux/arm64 的最新版本（Apple Silicon 原生运行）；
    # latest(0.0.77) 目前只有 amd64 镜像。
    image: michaelf34/infinity:0.0.75
    # 镜像 entrypoint 即 infinity_emb，直接传 v2 子命令参数。
    command: v2 --model-id BAAI/bge-m3 --port 7997
    environment:
      # 复用宿主机已有的 bge-m3 缓存（~/.cache/huggingface），离线模式
      # 零下载启动；未缓存过时去掉 HF_HUB_OFFLINE 让容器自行下载。
      HF_HOME: /app/.cache/huggingface
      HF_HUB_OFFLINE: 1
    ports:
      - "7997:7997"
    volumes:
      - ${HOME}/.cache/huggingface:/app/.cache/huggingface
    healthcheck:
      # 镜像基于 slim 无 curl；用 python urllib 探活 /health。
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:7997/health')
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 120s
    restart: unless-stopped

  backend:
    container_name: docqa-backend
    build:
      context: ./backend
    # 容器内通过 compose 服务名互访（取代 .env 中的 localhost 地址）：
    # postgres 容器内端口 5432（宿主 55432 仅为宿主机访问）；
    # embedding 容器内端口 7997。
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: docqa
      POSTGRES_PASSWORD: docqa
      POSTGRES_DB: docqa
      EMBEDDING_PROVIDER: http
      EMBEDDING_API_URL: http://embedding:7997
      APP_ENV: production
      # 与本地 .env 调优值一致：每路检索 top-20，融合后取 20 条交精排。
      # （不传则回落 config 默认 5，容器问答证据包与本地开发不一致。）
      RETRIEVAL_TOP_K: 20
      RETRIEVAL_FUSED_TOP_N: 20
    ports:
      - "8000:8000"
    # uploads（文档正文与封面）持久化：bind mount 宿主 backend/uploads，
    # 与本地开发/E2E 语义一致（#65 重试测试通过写磁盘文件模拟故障修复）；
    # 容器重建数据不丢。
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      embedding:
        condition: service_healthy
    healthcheck:
      # slim 镜像无 curl；用 python urllib 探活 /health。
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    container_name: docqa-frontend
    build:
      context: ./frontend
    # 多阶段构建：node 产出静态资源，nginx 提供服务；80 为容器内端口。
    # 宿主 8080 暴露给浏览器访问，/api 由 nginx 反代 backend 容器。
    ports:
      - "8080:80"
    depends_on:
      # 等 backend 健康后再启动，避免启动初期反代 502。
      backend:
        condition: service_healthy
    healthcheck:
      # alpine 无 curl；用 wget 探活首页。注意用 127.0.0.1 而非
      # localhost（后者解析到 ::1，nginx 仅监听 IPv4 会误报失败）。
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
